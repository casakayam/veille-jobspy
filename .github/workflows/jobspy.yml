name: Veille JobSpy

on:
  schedule:
    # 08:13 UTC = 3:13 à Bogota, plus de 4 h avant la veille Claude de 7:34 (lundi à samedi).
    # GitHub peut retarder un horaire de plusieurs heures : d'où la marge.
    - cron: "13 8 * * 1-6"
  # Relance automatique quand le script ou ce fichier change
  push:
    branches: [main]
    paths:
      - scrape.py
      - requirements.txt
      - .github/workflows/jobspy.yml
  workflow_dispatch:
    inputs:
      hours:
        description: "Fenêtre de publication en heures (72 par défaut, 336 = 14 jours pour un rattrapage)"
        required: false
        default: "72"

permissions:
  contents: write

concurrency:
  group: jobspy
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer JobSpy
        run: pip install -r requirements.txt

      - name: Lancer la veille
        env:
          HOURS_OLD: ${{ inputs.hours }}
        run: python scrape.py

      - name: Enregistrer les résultats
        run: |
          git config user.name "veille-jobspy"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Veille JobSpy $(date -u +%F)"
            git push
          fi
